<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Клевер — тренажёр печати</title>
<style>

*{box-sizing:border-box}body{margin:0;background:#edf5e9;color:var(--ink);font:16px system-ui,sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,textarea:focus-visible{outline:3px solid #568862;outline-offset:3px}
main{max-width:1120px;margin:auto;padding:28px 24px 48px}header,.bar,.section-top,.action,.hint{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:800;font-size:23px}.brand span{display:inline-grid;place-items:center;background:#d7ebd4;border-radius:12px;width:42px;height:42px;margin-right:8px}
.langs,.levels{display:flex;gap:5px;flex-wrap:wrap}.langs{background:#e0eddd;padding:4px;border-radius:14px}button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 13px;font-weight:650}.langs button{border:0;background:transparent}button[aria-pressed=true],button.primary{background:var(--dark);color:white;border-color:var(--dark)}button:disabled{opacity:.45;cursor:default}
.hero{position:relative;overflow:hidden;margin:24px 0 18px;padding:26px 30px;background:#dcefd9;border:1px solid #d1e6ce;border-radius:24px}.hero h1{font:700 clamp(35px,6vw,55px)/1.05 Georgia,serif;margin:0 0 8px}.hero p{margin:0;color:var(--muted);max-width:75%;position:relative}.bunny{position:absolute;right:5%;bottom:3px;font-size:clamp(48px,9vw,105px);line-height:1;transform:rotate(9deg)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 5px 18px #24452e08}.layout{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:16px;margin-top:14px}.side{align-self:start}.side h2,.card h2{font-size:19px;margin:0}.muted{color:var(--muted)}.small{font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#edf5e9;border-radius:12px;padding:9px 10px}.stat strong{display:block;font-size:23px}.stat span{font-size:13px;color:var(--muted)}
.practice{position:relative;background:#f4f8ef;border:1px solid #dce9d9;border-radius:14px;padding:14px;cursor:text}.practice:focus-within{border-color:#6b9b71;box-shadow:0 0 0 2px #d5e8d0}.prompt{font:600 clamp(20px,3vw,27px)/1.65 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#45634e}.word{display:inline-block}.done{color:#42784b}.current{background:#d2e8c7;border-bottom:2px solid #34704e;border-radius:3px;color:#183d27}.wrong{background:#ffdcd4;color:#923021}.practice textarea{position:absolute;inset:0;width:100%;height:100%;opacity:0;resize:none;cursor:text}.action{margin-top:12px}.track{height:5px;margin-top:12px;border-radius:10px;background:#e4eddf;overflow:hidden}.track div{height:100%;background:#589161;width:0}.keys{margin:12px 0}.row{display:flex;justify-content:center;gap:4px;margin:4px 0}.key{display:grid;place-items:center;position:relative;width:7%;min-width:0;aspect-ratio:1.08;border:1px solid #dae7d9;border-bottom-width:3px;border-radius:7px;background:#f3f7f1;font-weight:700;font-size:clamp(11px,2vw,16px)}.key.home{background:var(--finger)}.key.target{outline:2px solid #214f37;outline-offset:1px;background:var(--finger);color:#102e1c}.key.mark::after{content:'';position:absolute;bottom:3px;width:25%;height:2px;background:currentColor;opacity:.55}.key.space{width:36%;aspect-ratio:auto;height:30px}.key.shift{width:11%;aspect-ratio:auto}.hint{justify-content:flex-start;min-height:28px;margin-top:8px}
.layout{display:block}.typing-guide{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}.typing-guide .section-top{gap:6px}.typing-guide p{margin:6px 0}.keys{max-width:650px;margin:12px auto 0}.keyboard-visual{position:relative;max-width:650px;margin:12px auto 0;padding-bottom:38px}.keyboard-visual .keys{margin:0}.hand-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.typing-guide .hint{font-weight:750;color:var(--dark);background:#edf5e9;padding:7px 12px;border-radius:9px}.record{font-size:14px;color:var(--muted)}
@media(max-width:760px){main{padding:14px 12px 28px}.hero{padding:20px}.card{padding:13px}.key{border-radius:4px}.row{gap:3px}}
.manicure{display:flex;align-items:center;gap:6px}.manicure summary{cursor:pointer;background:#edf5e9;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:650}.manicure-options{display:flex;flex-wrap:wrap;gap:5px;padding:8px 0}.manicure-options button::before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--swatch);border:1px solid #345a4870;margin-inline-end:6px;vertical-align:middle}
</style>
<main>
<header><div class="brand"><span aria-hidden="true">☘</span><b id="brand">Клевер</b></div><div class="langs" id="languages" role="group" aria-label="Язык уроков"></div></header>
<section class="hero"><h1 id="hero-title">Печатай вслепую</h1><p id="hero-copy">От первых букв до целых текстов.</p><span class="bunny" aria-hidden="true">🐰</span></section>
<div class="bar"><div class="levels" id="levels" role="group" aria-label="Этап обучения"></div><span id="progressLabel" class="muted small"></span></div>
<div class="layout">
<section class="card">
<div class="section-top"><h2 id="title"></h2><span id="counter" class="small muted"></span></div>
<div class="stats"><div class="stat"><strong id="speed">0</strong><span id="speed-label">знаков/мин</span></div><div class="stat"><strong id="accuracy">—</strong><span id="accuracy-label">точность</span></div><div class="stat"><strong id="errors">0</strong><span id="errors-label">ошибок</span></div></div>
<div class="practice"><div class="prompt" id="prompt"></div><textarea id="typing" rows="1" aria-label="Набирай показанный текст" aria-describedby="prompt status" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></div>
<div class="track" aria-hidden="true"><div id="fill"></div></div>
<div class="action"><button id="prev">Назад</button><button id="reset">↻ Повторить</button><button id="next" class="primary">Дальше</button></div>
<p class="small muted" id="status" role="status"></p>
<section class="typing-guide" aria-labelledby="guide-title">
<div class="section-top"><h2 id="guide-title">Куда ставить пальцы</h2><span class="small muted" id="rest"></span></div>
<details class="manicure"><summary id="manicure-label">Маникюр</summary><div class="manicure-options" id="manicure-options" role="group" aria-labelledby="manicure-label"></div></details>
<div class="hint" id="hint"></div>
<div class="keyboard-visual" id="keyboard-visual" aria-hidden="true">
<div class="keys" id="keys"></div>
<svg class="hand-overlay" id="hands"></svg>
</div>
<p class="small muted" id="guide-copy">Поставь пальцы на клавиши их цвета. На клавишах под указательными пальцами есть бугорки. После нажатия верни палец на исходную клавишу.</p>
<p class="record" id="record"></p>
</section>
</section>
</div>
</main>
<script>
'use strict';
const courses = {

    ['The forest path','We walked along the forest path. A soft breeze moved the leaves, and birds sang above us.']
  ]},
  de: {name:'Deutsch', layout:'QWERTZ', top:'qwertzuiopü+', home:'asdfghjklöä#', bottom:'yxcvbnm,.-', groups:['as','gh','lö','ä','qw','er','tz','ui','op','üß','yx','cv','bn','m'], lessons:[
    ['F und J','fj fj jjf fffj fjf jff jf fj'],
    ['D und K kommen dazu','fd jk df kj fdk jkd kjf dfj'],
    ['Grundreihe','asdf jklö ä as df jk lö gh fj dk'],
    ['Obere und untere Reihe','qw er tz ui op üß yx cv bn m'],
    ['Kurze Wörter','das der die mit und auf grün süß schön'],
    ['Längere Wörter','Klee Hase Garten Wiese Blätter Blüte'],
    ['Im Garten','Ein kleiner Hase sitzt im Garten. Der Klee ist nass, und die Sonne wärmt die Wiese.'],
    ['Der Waldweg','Wir gehen durch den Wald. Der Wind bewegt die Blätter, und die Vögel singen.']
  ]}
};
const polish = {
  natural:'#eed5bb', sage:'#80ac84', pink:'#d987a3', lilac:'#a795cf', cherry:'#ad5764'
};
const translations = {
  ru: {
    brand:'Клевер', pageTitle:'Клевер — тренажёр печати', hero:'Печатай вслепую', intro:'От первых букв до целых текстов.',
    language:'Язык уроков', levels:'Этап обучения', stages:['Буквы','Слова','Тексты'],
    speed:'знаков/мин', accuracy:'точность', errors:'ошибок', input:'Набирай показанный текст',
    back:'Назад', repeat:'Повторить', next:'Дальше', hands:'Куда ставить пальцы', manicure:'Маникюр',
    polish:['Без покрытия','Шалфей','Розовый','Сирень','Вишня'],
    guide:'На клавишах под указательными пальцами есть бугорки. После нажатия верни палец на исходную клавишу.',
    home:'Исходный ряд', space:'Пробел', shift:'Shift другой рукой',
    fingers:['Левый мизинец','Левый безымянный','Левый средний','Левый указательный','Правый указательный','Правый средний','Правый безымянный','Правый мизинец','Большой палец'],
    newLetter:'Новая буква', newLetters:'Новые буквы', and:' и ',
    count:(at,total)=>'Урок '+at+' из '+total, progress:(done,total)=>'Пройдено '+done+' / '+total,
    ready:layout=>'Выбери раскладку '+layout+' и кликни по строке. Замер начнётся с первого нажатия.',
    wrongLayout:layout=>'Проверь раскладку: нужна '+layout+'.', wrongKey:'Попробуй ещё раз. Нажми подсвеченную клавишу.',
    typing:'Набирай строку, следуя подсветке.', complete:'Урок пройден',
    done:more=>more?'Готово! Можно повторить урок или перейти дальше.':'Готово! Можно повторить урок.',
    best:(speed,accuracy)=>'Рекорд урока: '+speed+' зн/мин · '+accuracy+'%', noBest:'Рекорд появится после урока'
  },
  en: {
    brand:'Clover', pageTitle:'Clover — typing tutor', hero:'Learn touch typing', intro:'From your first keystrokes to full passages.',
    language:'Lesson language', levels:'Practice stage', stages:['Letters','Words','Passages'],
    speed:'chars/min', accuracy:'accuracy', errors:'errors', input:'Type the text shown',
    back:'Back', repeat:'Retry', next:'Next', hands:'Where to place your fingers', manicure:'Manicure',
    polish:['Bare nails','Sage','Pink','Lilac','Cherry'],
    guide:'Feel for the bumps under your index fingers. After each keystroke, return your finger to its home key.',
    home:'Home row', space:'Space', shift:'Shift with the other hand',
    fingers:['Left pinky','Left ring finger','Left middle finger','Left index finger','Right index finger','Right middle finger','Right ring finger','Right pinky','Thumb'],
    newLetter:'New letter', newLetters:'New letters', and:' and ',
    count:(at,total)=>'Lesson '+at+' of '+total, progress:(done,total)=>'Completed '+done+' / '+total,
    ready:layout=>'Switch to '+layout+' and click the text. The timer starts with your first keystroke.',
    wrongLayout:layout=>'Check your keyboard layout. Use '+layout+'.', wrongKey:'Try again. Press the highlighted key.',
    typing:'Follow the highlighted keys as you type.', complete:'Lesson complete',
    done:more=>more?'Done! Retry this lesson or move on.':'Done! You can retry this lesson.',
    best:(speed,accuracy)=>'Personal best: '+speed+' chars/min · '+accuracy+'%', noBest:'Finish the lesson to set a personal best'
  },
  de: {
    brand:'Klee', pageTitle:'Klee — Tipptrainer', hero:'Lerne blind zu tippen', intro:'Von den ersten Buchstaben bis zu ganzen Texten.',
    language:'Unterrichtssprache', levels:'Übungsstufe', stages:['Buchstaben','Wörter','Texte'],
    speed:'Zeichen/Min.', accuracy:'Genauigkeit', errors:'Fehler', input:'Tippe den angezeigten Text',
    back:'Zurück', repeat:'Wiederholen', next:'Weiter', hands:'Wohin mit den Fingern?', manicure:'Maniküre',
    polish:['Ohne Lack','Salbei','Rosa','Flieder','Kirsche'],
    guide:'Ertaste die Erhebungen unter den Zeigefingern. Führe nach jedem Anschlag den Finger zur Ausgangstaste zurück.',
    home:'Grundreihe', space:'Leertaste', shift:'Umschalttaste mit der anderen Hand',
    fingers:['Linker kleiner Finger','Linker Ringfinger','Linker Mittelfinger','Linker Zeigefinger','Rechter Zeigefinger','Rechter Mittelfinger','Rechter Ringfinger','Rechter kleiner Finger','Daumen'],
    newLetter:'Neuer Buchstabe', newLetters:'Neue Buchstaben', and:' und ',
    count:(at,total)=>'Lektion '+at+' von '+total, progress:(done,total)=>'Abgeschlossen '+done+' / '+total,
    ready:layout=>'Wechsle zum Layout '+layout+' und klicke auf den Text. Die Zeitmessung beginnt mit dem ersten Anschlag.',
    wrongLayout:layout=>'Prüfe das Tastaturlayout. Verwende '+layout+'.', wrongKey:'Versuch es noch einmal. Drücke die markierte Taste.',
    typing:'Folge beim Tippen den markierten Tasten.', complete:'Lektion abgeschlossen',
    done:more=>more?'Fertig! Du kannst die Lektion wiederholen oder weitermachen.':'Fertig! Du kannst die Lektion wiederholen.',
    best:(speed,accuracy)=>'Bestleistung: '+speed+' Zeichen/Min. · '+accuracy+'%', noBest:'Schließe die Lektion ab, um eine Bestleistung zu speichern'
  }
};
// Keep the two opening drills, then practice each new key alone and with familiar keys.
for (const [language, course] of Object.entries(courses)) {
  const ui = translations[language];
  const [first, second, homeReview, rowReview, ...reading] = course.lessons;
  const homeGroups = course.groups.slice(0, course.groups.indexOf(course.top.slice(0,2)));
  const upperAndLower = course.groups.slice(homeGroups.length);
  let familiar = [...new Set((first[1] + second[1]).replaceAll(' ',''))];
  function drill(group) {
    const fresh = [...group].filter(char=>!familiar.includes(char));
    const words = [];
    for (const char of fresh) {
      const neighbor = familiar.at(-1);
      words.push(char.repeat(3), char+neighbor+char+neighbor, neighbor+char+char+neighbor);
      familiar.push(char);
    }
    if (fresh.length===2) words.push(fresh.join('').repeat(2),fresh.slice().reverse().join('').repeat(2));
    const label = fresh.map(char=>char==='ß'?'ß':char.toUpperCase()).join(ui.and);
    return [(fresh.length===1?ui.newLetter:ui.newLetters)+' · '+label,words.join(' ')];
  }
  const homeDrills = homeGroups.map(drill);
  const otherDrills = upperAndLower.map(drill);
  const homeIndex = 2 + homeDrills.length;
  const rowIndex = homeIndex + 1 + otherDrills.length;
  course.lessons = [first, second, ...homeDrills, homeReview, ...otherDrills, rowReview, ...reading];
  course.stages = [[ui.stages[0],0],[ui.stages[1],rowIndex+1],[ui.stages[2],rowIndex+3]];
  course.oldIndexes = [0,1,homeIndex,rowIndex,rowIndex+1,rowIndex+2,rowIndex+3,rowIndex+4];
}
const colors = ['#ebd8ef','#f5dbce','#fae9b5','#cde7ba','#bfe4d2','#cde1f4','#e2d9f5','#f4d8e5','#e6ecdc'];
const columnFinger = [0,1,2,3,3,4,4,5,6,7,7,7];
const homeColumns = [0,1,2,3,6,7,8,9];
const byId = id => document.getElementById(id);
const input = byId('typing');
let saved = {};
try { saved = JSON.parse(localStorage.getItem('clover-typing-v1')) || {}; } catch {}
let lang = Object.hasOwn(courses,saved.lang) ? saved.lang : 'ru';
let ui = translations[lang];
let manicure = Object.hasOwn(polish,saved.manicure) ? saved.manicure : 'natural';
if (saved.version !== 2) {
  for (const [language, course] of Object.entries(courses)) {
    const previous = saved[language];
    if (!previous) continue;
    const remap = values=>Object.fromEntries(Object.entries(values).map(([index,value])=>[course.oldIndexes[index],value]));
    saved[language] = {
      lesson: previous.lesson<2 ? previous.lesson : 2,
      completed: remap(previous.completed),
      best: remap(previous.best)
    };
  }
  saved.version = 2;
}
let lesson, course, phrase, pos, attempts, errors, started, finished, missed, keyMap;
function progress(){
  saved[lang] ??= {lesson:0, completed:{}, best:{}};
  return saved[lang];
}
function save(){
  saved.lang = lang;
  if(manicure!=='natural' || saved.manicure) saved.manicure = manicure;
  try { localStorage.setItem('clover-typing-v1',JSON.stringify(saved)); } catch {}
}
function element(tag, name, content){
  const node = document.createElement(tag);
  node.className = name;
  node.textContent = content;
  return node;
}
function toggleButtons(container, entries, selected, onSelect){
  byId(container).replaceChildren(...entries.map(([label,value])=>{
    const button = element('button','',label);
    button.type = 'button';
    button.setAttribute('aria-pressed',String(value===selected));
    button.onclick = ()=>onSelect(value);
    return button;
  }));
}
function addKey(row, char, finger, style='', label=char.toUpperCase()){
  const key = element('span','key '+style,label);
  key.style.setProperty('--finger',colors[finger]);
  row.append(key);
  keyMap.set(char,{key,finger});
}
function keyboard(){
  keyMap = new Map();
  const keyboard = byId('keys');
  keyboard.replaceChildren();
  const numbers = element('div','row','');
  if(lang==='ru') addKey(numbers,'ё',0);
  [...'1234567890'].forEach((char,index)=>addKey(numbers,char,columnFinger[index]));
  if(lang==='de') addKey(numbers,'ß',7,'','ß');
  keyboard.append(numbers);
  for (const [name, letters] of [['top',course.top],['home',course.home],['bottom',course.bottom]]) {
    const row = element('div','row','');
    if (name==='bottom') addKey(row,'shiftL',0,'shift','⇧');
    [...letters].forEach((char,index)=>{
      const home = name==='home' && homeColumns.includes(index);
      const mark = home && [3,6].includes(index);
      const finger = lang==='ru' && char==='.' ? 7 : columnFinger[index];
      addKey(row,char,finger,(home?'home ':'')+(mark?'mark':''));
    });
    if (name==='bottom') addKey(row,'shiftR',7,'shift','⇧');
    keyboard.append(row);
  }
  if(lang==='ru'){
    const period = keyMap.get('.');
    keyMap.set(',',period);
    keyMap.delete('.');
    period.key.textContent = './,';
    keyMap.set('.',period);
  }
  const row = element('div','row','');
  addKey(row,' ',8,'space',ui.space);
  keyboard.append(row);
}
function drawHands(){
  const overlay = byId('hands');
  const bounds = overlay.getBoundingClientRect();
  if (!bounds.width || !bounds.height) return;
  overlay.setAttribute('viewBox','0 0 '+bounds.width+' '+bounds.height);
  overlay.replaceChildren();
  function center(key){
    const box = key.getBoundingClientRect();
    return {x:box.left-bounds.left+box.width/2, y:box.top-bounds.top+box.height/2};
  }
  function path(d, fill, stroke, width){
    const shape = document.createElementNS('http://www.w3.org/2000/svg','path');
    for (const [name,value] of Object.entries({d,fill,stroke,'stroke-width':width,'stroke-linecap':'round','stroke-linejoin':'round'})) {
      shape.setAttribute(name,value);
    }
    if (fill !== 'none') shape.setAttribute('fill-opacity', fill===polish[manicure] ? '.62' : '.56');
    shape.setAttribute('stroke-opacity','.64');
    overlay.append(shape);
  }
  const space = center(keyMap.get(' ').key);
  const unit = keyMap.get(course.home[3]).key.getBoundingClientRect().width;
  const current = phrase[pos];
  const target = current===undefined ? null : keyMap.get(current.toLowerCase());
  const shift = target && (current!==current.toLowerCase() || (lang==='ru' && current===','))
    ? keyMap.get(target.finger<4?'shiftR':'shiftL')
    : null;
  const widths = [.16,.19,.21,.20,.20,.21,.19,.16,.23];
  for (const [direction,indexes] of [[1,[0,1,2,3]],[-1,[7,6,5,4]]]){
    const homes = indexes.map(index=>center(keyMap.get(course.home[homeColumns[index]]).key));
    const outer = homes[0].x;
    const inner = homes[3].x;
    const knuckleY = space.y - unit*.13;
    const wristY = bounds.height - 5;
    path(
      'M '+(outer-direction*unit*.12)+' '+knuckleY+
      ' C '+(outer-direction*unit*.23)+' '+(knuckleY+unit*.45)+' '+(outer+direction*unit*.24)+' '+(wristY-12)+' '+(outer+direction*unit*.58)+' '+wristY+
      ' Q '+(inner-direction*unit*.8)+' '+(wristY+4)+' '+(inner-direction*unit*.45)+' '+wristY+
      ' C '+(inner-direction*unit*.21)+' '+(wristY-11)+' '+(inner+direction*unit*.48)+' '+(knuckleY+unit*.4)+' '+(inner+direction*unit*.28)+' '+(knuckleY-unit*.09)+
      ' Q '+(inner-direction*unit*1.24)+' '+(knuckleY-unit*.64)+' '+(outer-direction*unit*.12)+' '+knuckleY+' Z',
      '#efd0b5','#626850',1.3
    );
    function finger(fromX, fromY, destination, active, index){
      const dx = destination.x-fromX;
      const dy = destination.y-fromY;
      const length = Math.hypot(dx,dy) || 1;
      const ux = dx/length;
      const uy = dy/length;
      const radius = Math.max(3.6,unit*widths[index]);
      const arc = direction*radius*(index===8 ? 1.05 : .48);
      function point(at, across=0){
        const side = across+Math.sin(Math.PI*at)*arc;
        return (fromX+dx*at-uy*side)+' '+(fromY+dy*at+ux*side);
      }
      const cap = Math.min(.20,radius/length);
      const tip = 1-cap;
      path(
        'M '+point(-.06,-radius)+
        ' C '+point(.23,-radius*1.08)+' '+point(.31,-radius*.91)+' '+point(.46,-radius*.88)+
        ' C '+point(.62,-radius*.92)+' '+point(.72,-radius*.68)+' '+point(tip,-radius*.69)+
        ' Q '+point(1.05,-radius*.65)+' '+point(1.04,0)+
        ' Q '+point(1.05,radius*.68)+' '+point(tip,radius*.69)+
        ' C '+point(.72,radius*.66)+' '+point(.61,radius*.92)+' '+point(.46,radius*.88)+
        ' C '+point(.26,radius*.98)+' '+point(.17,radius*1.12)+' '+point(-.06,radius)+' Z',
        active?'#edcbaa':'#f5d8bd','#605943',active?1.65:1.05
      );
      // Keep nail beds short and rounded, following each fingertip's angle.
      const bed = Math.max(.61,1-cap*1.85);
      path(
        'M '+point(bed,-radius*.41)+
        ' Q '+point(bed-cap*.32,0)+' '+point(bed,radius*.41)+
        ' L '+point(1-cap*.63,radius*.43)+
        ' Q '+point(1.012,0)+' '+point(1-cap*.63,-radius*.43)+' Z',
        polish[manicure],'#715b50',.7
      );
      path('M '+point(.53,-radius*.63)+' Q '+point(.58,0)+' '+point(.52,radius*.63),'none','#91664a',.8);
      if(active) path('M '+point(.27,-radius*.68)+' Q '+point(.32,0)+' '+point(.28,radius*.68),'none','#377756',1.5);
    }
    function drawFinger(index){
      const position = indexes.indexOf(index);
      const home = homes[position];
      const activeKey = target?.finger===index ? target : shift?.finger===index ? shift : null;
      const baseX = home.x+(1.5-position)*direction*unit*.15;
      const baseY = knuckleY+unit*[.18,.03,-.12,-.04][position];
      finger(baseX,baseY,activeKey?center(activeKey.key):home,Boolean(activeKey),index);
    }
    indexes.filter(index=>target?.finger!==index && shift?.finger!==index).forEach(drawFinger);
    finger(inner+direction*unit*.22,wristY-8,{x:space.x-direction*unit*.43,y:space.y},target?.finger===8,8);
    indexes.filter(index=>target?.finger===index || shift?.finger===index).forEach(drawFinger);
  }
}
function localize(){
  document.documentElement.lang = lang;
  document.title = ui.pageTitle;
  const labels = {
    brand:ui.brand, 'hero-title':ui.hero, 'hero-copy':ui.intro,
    'speed-label':ui.speed, 'accuracy-label':ui.accuracy, 'errors-label':ui.errors,
    prev:ui.back, reset:'↻ '+ui.repeat, next:ui.next, 'guide-title':ui.hands,
    'manicure-label':ui.manicure, 'guide-copy':ui.guide
  };
  for (const [id,label] of Object.entries(labels)) byId(id).textContent = label;
  for (const [id,label] of [['languages',ui.language],['levels',ui.levels],['typing',ui.input]]) {
    byId(id).setAttribute('aria-label',label);
  }
  const options = Object.entries(polish).map(([value,color],index)=>{
    const button = element('button','',ui.polish[index]);
    button.type = 'button';
    button.style.setProperty('--swatch',color);
    button.setAttribute('aria-pressed',String(value===manicure));
    button.onclick = ()=>{
      manicure = value;
      save();
      options.forEach((option,i)=>option.setAttribute('aria-pressed',String(i===index)));
      drawHands();
    };
    return button;
  });
  byId('manicure-options').replaceChildren(...options);
}
function begin(index,focus=false){
  ui = translations[lang];
  localize();
  course = courses[lang];
  lesson = Math.max(0,Math.min(course.lessons.length-1,index));
  const data = progress();
  data.lesson = lesson;
  save();
  phrase = [...course.lessons[lesson][1]];
  pos = attempts = errors = 0;
  started = finished = null;
  missed = false;
  input.disabled = false;
  input.value = '';
  input.lang = lang;
  byId('prompt').lang = lang;
  byId('title').textContent = course.lessons[lesson][0];
  byId('counter').textContent = ui.count(lesson+1,course.lessons.length);
  byId('prev').disabled = lesson===0;
  byId('next').disabled = lesson===course.lessons.length-1;
  byId('rest').textContent = ui.home+' · '+homeColumns.slice(0,4).map(i=>course.home[i]).join('').toUpperCase()+' '+homeColumns.slice(4).map(i=>course.home[i]).join('').toUpperCase();
  toggleButtons('languages',Object.entries(courses).map(([key,value])=>[value.name,key]),lang,value=>{
    lang = value;
    begin(progress().lesson,true);
  });
  toggleButtons('levels',course.stages,course.stages.findLast(([,index])=>index<=lesson)[1],value=>begin(value,true));
  keyboard();
  message(ui.ready(course.layout));
  render();
  if (focus) input.focus();
}
function message(value){ byId('status').textContent = value; }
function metrics(){
  const elapsed = started===null ? 0 : (finished ?? performance.now())-started;
  return {speed:elapsed>=1000?Math.round(pos*60000/elapsed):0, accuracy:attempts?Math.round(pos*100/attempts):null};
}
function renderMetrics(){
  const result = metrics();
  byId('speed').textContent = result.speed;
  byId('accuracy').textContent = result.accuracy===null?'—':result.accuracy+'%';
  byId('errors').textContent = errors;
}
function render(){
  renderMetrics();
  const prompt = byId('prompt');
  prompt.replaceChildren();
  let word = element('span','word','');
  phrase.forEach((char,index)=>{
    if(char===' '){
      prompt.append(word);
      word = element('span','word','');
    }
    const part = element('span',index<pos?'done':index===pos?'current'+(missed?' wrong':''):'',char===' ' && index===pos?'␣':char);
    if(char===' ') prompt.append(part);
    else word.append(part);
  });
  prompt.append(word);
  byId('fill').style.width = (100*pos/phrase.length)+'%';
  for(const item of keyMap.values()) item.key.classList.remove('target');
  const char = phrase[pos];
  const key = char===undefined?null:keyMap.get(char.toLowerCase());
  if(key){
    key.key.classList.add('target');
    const shift = char!==char.toLowerCase() || (lang==='ru' && char===',');
    if(shift) {
      const shiftKey = keyMap.get(key.finger<4?'shiftR':'shiftL');
      shiftKey.key.classList.add('target');
    }
    byId('hint').textContent = (char===' '?ui.space:char==='ß'?'ß':char.toUpperCase())+' · '+ui.fingers[key.finger]+(shift?' + '+ui.shift:'');
  } else byId('hint').textContent = '☘ '+ui.complete;
  drawHands();
  const data = progress();
  byId('progressLabel').textContent = ui.progress(Object.keys(data.completed).length,course.lessons.length);
  const best = data.best[lesson];
  byId('record').textContent = best?ui.best(best.speed,best.accuracy):ui.noBest;
}
function type(char){
  if(finished!==null || [...char].length!==1) return;
  started ??= performance.now();
  attempts++;
  missed = char!==phrase[pos];
  if(missed){
    errors++;
    const looksWrong = (lang==='ru' && /^[a-z]$/i.test(char)) || (lang!=='ru' && /^[а-яё]$/i.test(char));
    message(looksWrong?ui.wrongLayout(course.layout):ui.wrongKey);
  }else{
    pos++;
    if(pos===phrase.length){
      finished = performance.now();
      const data = progress();
      const result = metrics();
      data.completed[lesson] = true;
      if(!data.best[lesson] || result.speed>data.best[lesson].speed ||
        (result.speed===data.best[lesson].speed && result.accuracy>data.best[lesson].accuracy)) data.best[lesson] = result;
      save();
      message(ui.done(lesson<course.lessons.length-1));
      input.disabled = true;
      byId(lesson<course.lessons.length-1?'next':'reset').focus();
    } else message(ui.typing);
  }
  render();
}
input.addEventListener('keydown',event=>{
  if(event.isComposing || event.metaKey || event.ctrlKey || event.altKey || [...event.key].length!==1) return;
  event.preventDefault();
  if(!event.repeat) type(event.key);
});
input.addEventListener('beforeinput',event=>{
  event.preventDefault();
  if(event.inputType==='insertText' || event.inputType==='insertCompositionText') type(event.data ?? '');
});
input.addEventListener('input',()=>{ input.value=''; });
byId('prev').onclick = ()=>begin(lesson-1,true);
byId('next').onclick = ()=>begin(lesson+1,true);
byId('reset').onclick = ()=>begin(lesson,true);
setInterval(()=>{if(started!==null && finished===null) renderMetrics();},250);
begin(progress().lesson);
new ResizeObserver(drawHands).observe(byId('keyboard-visual'));
</script>
</html>
